	server {
        listen 81;
		server_name _;
		#listen 8444 ssl http2;
		#listen [::]:8444 ssl http2;
		#listen 8443 ssl http2;
		#listen [::]:8443 ssl http2;
		#ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem; # Path to your certificate
		#ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem; # Path to your private key
		# 1. Route for React Frontend
		root /var/www/mitram-touroperator-frontend;
		index index.html;
        location / {
			  # The try_files directive handles client-side routing.
              # It attempts to serve the requested URI as a static file, 
              # as a directory, and finally falls back to index.html for React Router to handle.
             try_files $uri $uri/ /index.html;
			 # Intercept 404s from the frontend service and serve the root instead
			 proxy_intercept_errors on;
			 error_page 404 =200 /index.html; 
            }
		
        # 2. Route for Node.js Backend
        location /api/ {
		    # Rewrite the URL to remove /api/ before forwarding
		    # The trailing slash in proxy_pass handles path stripping
           	proxy_pass http://mitram-touroperator-backend:5000/; # Use your Node service name
            proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
        }

        # 3. Fix for React Router 404s (on page refresh)
        # If serving static build files directly instead of proxying a dev server:
        # try_files $uri /index.html;
		# Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }