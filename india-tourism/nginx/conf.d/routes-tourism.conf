		# Upstreams
		upstream tourism_frontend {
			server mitram-tourism-frontend:80;
		}

		upstream tourism_backend {
			server mitramtourism-backend:8090;  # adjust if your backend listens on a different port
		}
   
   server {
        listen 80;
		server_name _;
		#listen 8443 ssl http2;
		#listen [::]:8443 ssl http2;
		#ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem; # Path to your certificate
		#ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem; # Path to your private key
		#don't have root in parent nginx
		#root /var/www/mitram-tourism-frontend/build;
		#index index.html;
		# 1. Route for React Frontend
        location / {
	        # as a directory, and finally falls back to index.html for React Router to handle.
            #try_files $uri $uri/ /index.html;
			proxy_pass http://tourism_frontend/;
			 # Intercept 404s from the frontend service and serve the root instead
			#proxy_intercept_errors on;
			#error_page 404 =200 /index.html; 
			
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			# SPA fallback
			#try_files $uri/ /index.html;
            }
		
        # 2. Route for Node.js Backend
        location /api/ {
		    # Rewrite the URL to remove /api/ before forwarding
		    # The trailing slash in proxy_pass handles path stripping
           	proxy_pass http://tourism_backend; # Use your Node service name
            
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
		location /.well-known/ {
			return 404;
		}
		
        #==========================
        # 4.Static Asset caching
		#==========================
		
		#location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
		 #  expires 30d;
		  # add_header Cache-Control "public, no-transform";
		#}
        # 3. Fix for React Router 404s (on page refresh)
        # If serving static build files directly instead of proxying a dev server:
        # try_files $uri /index.html;
		# Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
	

