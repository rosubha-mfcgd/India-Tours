user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    map $http_origin $cors_allowed_origin {
        default "";
        "http://mitramtourism.com" $http_origin;
        "http://mitramtourism.tk"   $http_origin;
        "http://mitramtouroperator.com" $http_origin;
		"http://mitramtouroperator.tk" $http_origin;
		"https://google-analytics.com" $http_origin;
    }
    sendfile        on;
    keepalive_timeout  65;

    # DNS resolver for Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    # Include additional configs if needed
    include /etc/nginx/conf.d/routes-tourism.conf;
	include /etc/nginx/conf.d/routes-operator.conf;
	
	
}
