services:
  mitram-tourism-frontend:
    build: 
      context: ./
      args:
      - REACT_APP_SERVER_URI=/api/ # Example
      dockerfile: Dockerfile
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_PRIMARY_REGION}:mitram-tourism-frontend
    env_file:
      - ./.env
    container_name: mitram-tourism-web
    networks:
      - mitramtourism-net
    restart: always
volumes:
  keycloak_data:
    driver: local
  postgres-data:
    driver: local
networks:
  mitramtourism-net:
    driver: bridge
    external: true
  touroperator-net:
    driver: bridge
    external: true