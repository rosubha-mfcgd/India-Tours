services:
  mitram-tourism-frontend:
    build: 
      context: ./
      args:
      - REACT_APP_SERVER_URI=/api/ # Example
      dockerfile: Dockerfile
    image: 157208622016.dkr.ecr.ap-south-1.amazonaws.com/mitramdocker/mitram-app-hub:mitram-tourism-frontend-latest
    env_file:
      - ./.env
    container_name: mitram-tourism-web
    networks:
      - mitramtourism-net
    restart: always
volumes:
  keycloak_data:
    driver: local
  postgres-data:
    driver: local
networks:
  mitramtourism-net:
    driver: bridge
    external: true
  touroperator-net:
    driver: bridge
    external: true