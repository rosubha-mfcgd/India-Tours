services:
  react-web-app:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - 8083:80
    container_name: mitram-tourism-web
    networks:
      - mitramtourism-net
    environment:
      - REACT_APP_SERVER_URI=http://mitramtourism-backend:8090
    restart: always
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mitramtourism-net
    depends_on:
      - react-web-app
networks:
  mitramtourism-net:
    external: true
