events { worker_connections 1024; }
http {

      include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;

    keepalive_timeout  65;
	 # Use Google DNS or your preferred DNS server
    resolver 127.0.0.11 valid=30s;
    
    server {
        listen 80;
		
        # 1. Route for React Frontend
        location / {
		    proxy_pass http://mitram-tourism-frontend:80; # Use your Node service name
         	proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
			  # The try_files directive handles client-side routing.
             # It attempts to serve the requested URI as a static file, 
            # as a directory, and finally falls back to index.html for React Router to handle.
             #try_files $uri $uri/ /index.html;
            }
		
        # 2. Route for Node.js Backend
        location /api/ {
		    # Rewrite the URL to remove /api/ before forwarding
		    # The trailing slash in proxy_pass handles path stripping
           	proxy_pass http://mitramtourism-backend:8090; # Use your Node service name
            proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
        }

        # 3. Fix for React Router 404s (on page refresh)
        # If serving static build files directly instead of proxying a dev server:
        # try_files $uri /index.html;
		# Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
		  # Ensure static assets (JS, CSS, images) are served correctly with proper caching
		location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        root /var/www/your-app/build;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    }
}