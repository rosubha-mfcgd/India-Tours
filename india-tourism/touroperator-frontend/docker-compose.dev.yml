services:
  mitram-touroperator-frontend:
    build: 
      context: ./
      dockerfile: Dockerfile
      args:
       REACT_APP_SERVER_URI: "http://api.mitramtouroperator.com/api/" # Example
    env_file:
      - ./.env
    environment:
      VIRTUAL_HOST: "mitramtouroperator.com"
      LETSENCRYPT_HOST: "mitramtouroperator.com"
      LETSENCRYPT_EMAIL: "roy.cognizant.subhankar623@gmail.com"
    container_name: mitram-touroperator-frontend
    depends_on:
      - mitram-touroperator-backend
    networks:
      - touroperator-net
    restart: always 
networks:
  touroperator-net:
    driver: bridge
    external: true
  