services:
  mitramtourism-backend:
    profiles: ["tourism"]
    build: 
      context: ./
      dockerfile: Dockerfile
    env_file:
      - ./server.env.dev
    container_name: mitramtourism-backend
    ports:
      - "8090:8090"
    environment:
      VIRTUAL_HOST: "api.mitramtourism.com"
      LETSENCRYPT_HOST: "api.mitramtourism.com"
      LETSENCRYPT_EMAIL: "roy.cognizant.subhankar623@gmail.com"
    depends_on:
      - keycloak
    networks:
      - mitramtourism-net
    restart: always
    command: npm start
    
volumes:
  keycloak_data:
    driver: local
  postgres-data:
    driver: local
networks:
  mitramtourism-net:
    driver: bridge
    external: true
  touroperator-net:
    driver: bridge
    external: true