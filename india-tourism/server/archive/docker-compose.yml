services:
   web:
    image: nginx:alpine
    networks:
      - mitramtourism-net
   postgres:
    image: postgres:18
    container_name: postgres_db
    environment:
      POSTGRES_DB: keycloakdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - mitramtourism-net
      
   keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak6
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloakdb
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./realm-keycloak.json:/opt/keycloak/data/import/realm-config.json
      - keycloak_data:/opt/keycloak/data/
    command: ["start-dev", "--import-realm"]
    networks:
      - mitramtourism-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/auth/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on:
      - postgres
  
  # 3. My Backend Application
   mitramtourism-backend:
    build: ./ # Path to your Dockerfile
    container_name: mitramtourism-backend
    environment:
     - OIDC_ISSUER_URL=http://keycloak:8080/realms/mitram-dev
      # Use internal Docker network name for backend-to-keycloak comms
     - OIDC_CLIENT_ID=mitram-tourism-client
    ports:
      - "8090:8090"
    depends_on:
      - keycloak
    networks:
      - mitramtourism-net
    restart: always
    command: npm start

networks:
  mitramtourism-net:
    external: true
volumes:
  keycloak_data:
  postgres-data: