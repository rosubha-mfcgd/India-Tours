services:
  mitram-touroperator-backend:
    profiles: ["operator"]
    build: 
      context: ./
      dockerfile: Dockerfile
    env_file:
      - ./.env
    container_name: mitram-touroperator-backend
    ports:
      - "5000:5000"
    environment:
      VIRTUAL_HOST: "api.mitramtouroperator.com"
      VIRTUAL_PORT: 5000
      LETSENCRYPT_HOST: "api.mitramtouroperator.com"
      LETSENCRYPT_EMAIL: "roy.cognizant.subhankar623@gmail.com"
    expose:
    - "5000"
    networks:
      - touroperator-net
    restart: always
    command: npm start
networks:
  touroperator-net:
    driver: bridge
    external: true