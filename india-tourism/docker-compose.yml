services:
  mitram-tourism-frontend:
    image: mitram-tourism-frontend:latest
    build: 
      context: ./tourism-web
      args:
      - REACT_APP_SERVER_URI=/api/ # Example
      dockerfile: Dockerfile
    container_name: mitram-tourism-web
    env_file:
      - ./tourism-web/tourismweb.env
    networks:
      - mitramtourism-net
    restart: always
  
  postgres:
    image: postgres:18
    container_name: postgres_db
    environment:
      POSTGRES_DB: keycloakdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - mitramtourism-net
  
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak6
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloakdb
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
      KC_HOSTNAME: http://keycloak6:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./server/realm-keycloak.json:/opt/keycloak/data/import/realm-config.json
      - keycloak_data:/opt/keycloak/data/
    command:
      - start-dev
      - --import-realm
      - --http-enabled=true
      - --hostname-strict=false
    networks:
      - mitramtourism-net
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health/ready
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on:
      - postgres
  
  mitramtourism-backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: mitramtourism-backend
    ports:
      - "8090:8090"
    env_file:
      - ./server/server.env
    depends_on:
      - mitram-tourism-frontend
      - keycloak
    networks:
      - mitramtourism-net
    restart: always
    command: npm start
  
  nginx:
    image: nginx:alpine
    container_name: nginx_reverse_proxy
    ports:
      - "80:80" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/build:/usr/share/nginx/html:ro # Mount built React files
    depends_on:
      - mitram-tourism-frontend
      - mitramtourism-backend
    networks:
      - mitramtourism-net
  
volumes:
  keycloak_data:
    driver: local
  postgres-data:
    driver: local
networks:
  mitramtourism-net:
    driver: bridge
    external: true